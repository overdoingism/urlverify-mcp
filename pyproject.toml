[project]
name = "urlverify-mcp"
version = "0.1.0"
description = "MCP server that verifies whether a download / install / data-source URL comes from an official channel."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.12,<2",
    "httpx>=0.27",
    "openai>=1.40",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tldextract>=5.1",
    "idna>=3.7",
    "certifi>=2024.6.2",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
urlverify-mcp = "urlverify_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["urlverify_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
