# Live regression cases (need network + LLM). Run: python -m pytest tests/test_live.py --live
# Each check family should have at least one true and one false case.
- id: lmstudio-official
  project: LM Studio
  url: https://lmstudio.ai/download
  description: LM Studio desktop app download page
  expect: VERIFIED_TRUE
- id: lmstudio-github-org
  project: LM Studio
  url: https://github.com/lmstudio-ai/lms
  description: lms CLI repository
  expect: VERIFIED_TRUE
- id: lmstudio-typosquat
  project: LM Studio
  url: https://lmstudio-download.com/
  description: LM Studio installer
  expect: VERIFIED_FALSE          # brand-in-label + not established (may resolve to UNVERIFIABLE if domain does not exist)
- id: qwen-hf-official
  project: Qwen3
  url: https://huggingface.co/Qwen/Qwen3-8B
  description: Qwen3 8B model weights
  expect: VERIFIED_TRUE
- id: qwen-hf-third-party-gguf
  project: Qwen3
  url: https://huggingface.co/bartowski/Qwen_Qwen3-8B-GGUF
  description: Qwen3 8B GGUF quantisation
  expect: VERIFIED_FALSE          # not the official org (a legitimate quantiser, but not official)
- id: vlc-official
  project: VLC media player
  url: https://www.videolan.org/vlc/
  description: VLC download page
  expect: VERIFIED_TRUE
- id: http-scheme
  project: VLC media player
  url: http://www.videolan.org/vlc/
  description: VLC download page over plain http
  expect: VERIFIED_FALSE
- id: homoglyph
  project: LM Studio
  url: https://lmstudіo.ai/
  description: cyrillic i homoglyph
  expect: VERIFIED_FALSE
- id: pypi-requests
  project: requests
  url: https://pypi.org/project/requests/
  description: requests HTTP library on PyPI
  expect: VERIFIED_TRUE                # fast path only if the latest release carries PEP 740 provenance; otherwise full path
- id: pypi-pypdf
  project: pypdf
  url: https://pypi.org/project/pypdf/
  description: pypdf on PyPI
  expect: VERIFIED_TRUE                # has PEP 740 provenance, but py-pdf is not a domain-verified org -> full path establishes it
- id: pypi-nonexistent
  project: requests
  url: https://pypi.org/project/reqeusts/
  description: typo of requests
  expect: VERIFIED_FALSE
  expect_path: registry_fast_path
- id: npm-lodahs-typosquat
  project: lodash
  url: https://www.npmjs.com/package/lodahs
  description: one edit away from lodash
  expect_any: [VERIFIED_FALSE, UNVERIFIABLE]
  expect_path: full                    # suspicious near-name must fall through to the full pipeline
  expect_risk_prefix: registry_typosquat
- id: npm-scoped-electron-asar
  project: "@electron/asar"
  url: https://www.npmjs.com/package/@electron/asar
  description: Electron's asar packaging tool
  expect: VERIFIED_TRUE
  expect_path: registry_fast_path      # scoped package with npm provenance from github.com/electron/asar (verified org)
