# URLVerify_MCP configuration. Copy to config.yaml (or set URLVERIFY_CONFIG=/path/to/file).
llm:
  enabled: true              # false = no-LLM mode (fixed lookups + rules only; see document_for_config.md)
  base_url: "http://127.0.0.1:8080/v1"   # any OpenAI-compatible endpoint (llama-server, LM Studio, vLLM, OpenAI, ...)
  api_key: "not-needed"
  model: "halogen-qwen3.8-flash-next"   # llama-server ignores this; halogen reports this id
  supports_tools: auto                    # true | false | auto (probe once, then remember)
  temperature: 0.1
  max_iterations: 24
  timeout_s: 300

search:
  provider: searxng_http                  # searxng_http (default) | mcp (SearXNG MCP server) | none (structured APIs only)
  call_timeout_s: 45                      # one search / fetch call may take at most this long
  mcp:
    url: "http://127.0.0.1:3000/mcp"      # existing SearXNG MCP (Streamable HTTP)
    search_tool: "searxng_web_search"
    fetch_tool: "web_url_read"
  searxng_http:
    base_url: "http://127.0.0.1:8888"

release_cooldown:
  hours: 72                               # 版本冷卻期（小時）；0 停用，僅提醒、不改來源裁決

fetch:
  provider: builtin                       # builtin (httpx + dependency-free HTML->text, default) | mcp (SearXNG MCP fetch tool)

budget:
  max_searches: 8
  max_fetches: 10
  max_api_calls: 20
  fetch_max_chars: 12000
  max_total_s: 900          # whole-verification deadline (seconds); past it the verdict is UNVERIFIABLE

identity:
  min_sources: 2            # independent third-party sources required (tier 1/2)
  allow_tier3: false        # forums / blogs / reddit
  history_days: 90          # Wikipedia / Wikidata stability window
  min_stable_revisions: 3
  # An old, widely read Wikimedia record may establish an official domain on its own (lowest-confidence TRUE,
  # notice WIKIMEDIA_ONLY). Checked only when the domain has Wikimedia as its single family. See document_for_config.md.
  wikimedia_solo:
    enabled: true
    min_monthly_views: 2000        # human page views of the en.wikipedia article, every month of the last 24
    sample_window_months: [18, 30] # a random past revision in this window must already carry the same domain
    max_confidence: 0.6
  github_token: ""          # optional, no permissions needed: 60 -> 5000 GitHub API requests/hour (see document_for_config.md)
  new_domain_days: 180      # CT first-seen / org creation younger than this = risk signal
  github_token: ""          # optional, raises API rate limit
  # Source tiers are additive to the built-in lists (identity/sources.py). eTLD+1 or full host.
  # tier1: structured / human-reviewed (wikidata, distro manifests, registries)  tier2: reputable media & vendor docs
  # tier3: forums, social, personal blogs (excluded unless allow_tier3)
  extra_tier1: []
  extra_tier2: ["docs.vultr.com", "learn.microsoft.com", "developer.nvidia.com"]
  extra_tier3: []
  # Temporal provenance: a tier-3 post (forum / social) proven older than this is promoted to tier 2.
  # Dates come from platform APIs / post ids / Wayback, never from the LLM. Login-walled platforms are never promoted.
  tier3_min_age_days: 365
  tier3_aged_max_count: 1
  domain_age_contradiction_years: 3
  aging_sources: {}          # domain -> reddit_api | hn_api | stackexchange_api | snowflake | discourse | github_api | jsonld | wayback | none

net:
  timeout_s: 15
  ct_check: true            # the leaf certificate must be publicly logged (embedded SCTs or crt.sh); catches TLS interception by a local CA
  doh_cross_check: true     # resolve again over DNS-over-HTTPS and compare; sends the host name to the resolvers below
  doh_resolvers: ["https://cloudflare-dns.com/dns-query", "https://dns.google/resolve"]
  user_agent: "URLVerify-MCP/0.1 (+https://github.com/overdoingism/urlverify-mcp)"   # keep a contact URL or email: Wikipedia returns 403 without one
  retries: 2                  # 429/502/503/504 from third-party services: retry with backoff
  retry_backoff_s: 3.0
  ct_first_seen_cache_days: 90  # CT first-seen dates never change: cache them (crt.sh is often overloaded)

cache:
  cert_ttl_hours: 168
  identity_ttl_hours: 720
  anchor_refresh_days: 30

storage:
  dir: "state"                 # plain JSON files (caches, history, health, auth, prompt overrides); relative to this file

log:
  dir: "log"                   # every log lives here (full/, server/, admin/); delete the folder any time
  process_max_bytes: 1048576
  process_backups: 5

lists:
  allowlist: []             # eTLD+1 or full hosts always considered official for a project: {project: "...", domain: "..."}
  denylist: []              # hosts / eTLD+1 always FALSE

injection_patterns:         # regex, case-insensitive; a hit on the target site => VERIFIED_FALSE
  - "\\b(ai|llm|language model|assistant|agent|verifier|claude|gpt|chatgpt|copilot)\\b[^.\\n]{0,80}\\b(this (site|website|page|domain) is|we are|trust|official|legitimate|safe|verified)"
  - "\\b(ignore|disregard) (all |any )?(previous|prior|above) (instructions|rules|prompts)"
  - "\\bto (any|all) (ai|llm|language models?|assistants?|agents?|bots?)\\b"
  - "\\b(system|developer) (prompt|instruction|override)\\b"
  - "\\bplease (report|respond|answer|mark|classify)[^.\\n]{0,60}\\b(verified|official|true|legitimate|safe)\\b"

prompts:
  dir: "state/prompts"          # edited prompts are stored here (admin UI > Prompts); defaults live in the package

server:                     # the MCP server itself (urlverify-mcp serve); CLI flags override these
  transport: stdio          # stdio | http   (http = Streamable HTTP at http://host:port/mcp)
  host: "127.0.0.1"
  port: 8766
  max_concurrent: 1         # verify_source calls at once; others queue (protects a local LLM)
  auth_token: ""            # optional: require "Authorization: Bearer <token>" on /mcp (HTTP transport)
  progress_events: true     # MCP progress notifications at each step (clients honouring them reset their timeout)
  heartbeat_s: 15           # progress heartbeat while a verification runs; 0 disables. Safe because every wait is bounded.

admin:                      # management web UI (urlverify-mcp admin); password-only login, default "admin"
  host: "127.0.0.1"
  port: 8765
  auth_file: "state/admin.auth"         # PBKDF2 hash + salt + session key; delete to reset the password
  session_days: 7

source:                       # how verify_source(source=...) is read; see document_for_config.md
  registries:                 # used when the command names no registry; a non-public one is reported, never replaced
    pypi: https://pypi.org/simple
    npm: https://registry.npmjs.org
    nuget: https://api.nuget.org/v3/index.json
  max_subjects: 8             # packages per command (pip install a b c ...)
  distro_archives: []         # apt mirrors of your distribution besides *.debian.org / *.ubuntu.com, e.g. free.nchc.org.tw/ubuntu

package_registry_fast_path:   # PyPI / npm: structured checks first, LLM only when inconclusive
  enabled: true
  mode: auto                  # auto | quick | full (callers may override with options.mode)
  min_age_days: 365
  min_releases: 3
  confidence: 0.8
  require_project_match: true # caller's project name must match the package / repository name
  typosquat_check: true       # false = skip near-name comparison, rely on the bidirectional repo link only
  toplist_size: 1500          # rows kept from the PyPI popularity list (~90 KB); streamed, the rest is never downloaded
  toplist_refresh_days: 60    # conditional re-fetch (ETag) at most this often; first download on first PyPI target
  toplist_url: "https://hugovk.github.io/top-pypi-packages/top-pypi-packages.min.json"
